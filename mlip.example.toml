# Example MLIP-side configuration.
# Copy to `mlip.toml` and replace paths/model specs for your environment.
# This file owns only ingest/MLIP concerns. Dataset-profile, analysis, plot,
# and learning-curve settings live in `experiment.toml`.
#
# Typical usage:
#   python -m moira --config mlip.toml
# Optional dataset overrides:
#   python -m moira --config mlip.toml data/raw_data/example_adsorption.json

[ingest]
source = "data/raw_vasp/systems"
dataset_name = "example_dataset"
profile = "vasp_mapping"         # or "elemental_adsorption_ase_db"
# Optional:
# catbench_folder = "data/intermediate/example_catbench"

[ingest.stoich]
elements = ["N", "C", "O", "H"]
basis_species = ["N2", "CH4", "O2", "H2"]

[ingest.stoich.basis_composition]
N2 = { N = 2 }
CH4 = { C = 1, H = 4 }
O2 = { O = 2 }
H2 = { H = 2 }

[mlip]
dev_n = 2
dev_run = false
adapter_backend = "rootstock" # "rootstock" or "legacy"
device = "cuda"               # falls back to "cpu" if CUDA is unavailable
optimizer = "FIRE"
# Optional:
# run_tag = "dev"
# dataset = "data/raw_data/example_adsorption.json"
# datasets = ["data/raw_data/example_adsorption.json"]
# results_dir = "data/results/MamunHighT2019"
# catbench_source = "vendor/catbench"

[mlip.models]
enabled = ["mace", "mattersim", "orb_v3", "sevennet", "uma"]

[mlip.rootstock]
root = "/path/to/rootstock"
# python = "/path/to/rootstock/.venv/bin/python"

[mlip.rootstock.models.mace]
model = "mace"
mlip_name = "mace-mh-1"
checkpoint = "medium"
# output_model = "optional-output-name"
# model_version = "optional-version"
# [mlip.rootstock.models.mace.metadata]
# provider = "acme"

[mlip.rootstock.models.mattersim]
model = "mattersim"
mlip_name = "mattersim-v1-5m"
checkpoint = "models/mattersim/mattersim-v1.0.0-5M.pth"

[mlip.rootstock.models.orb_v3]
model = "orb_v3"
checkpoint = "orb_v3_conservative_inf_omat"
mlip_name = "orb-v3-conservative-inf-omat"

[mlip.rootstock.models.sevennet]
model = "sevennet"
checkpoint = "7net-omni"
mlip_name = "7net-omni"

[mlip.rootstock.models.sevennet.metadata]
modal = "mpa"

[mlip.rootstock.models.uma]
model = "uma"
# For `adapter_backend = "rootstock"`, this can be a Rootstock alias like
# "uma-s-1p1". For `adapter_backend = "legacy"`, this must be a real checkpoint
# file path instead.
checkpoint = "uma-s-1p1"
mlip_name = "uma-s-1p1"

[mlip.rootstock.models.uma.metadata]
task_name = "omat"
