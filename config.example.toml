# Example MLIP-side configuration.
# Copy to `config.toml` and replace paths/model specs for your environment.
# This file owns only ingest/MLIP concerns. Dataset-profile, analysis, plot,
# and learning-curve settings live elsewhere.
#
# Run ingest directly with:
#   python -m moira.ingest --config config.toml
#
# `moira.ingest` reads `[ingest]`, loads the source dataset, builds CatBench
# coefficients from `[ingest.stoich]`, and materializes the emitted CatBench
# dataset that `moira` can then run.
#
# Supported ingest profiles:
# - `vasp_mapping`: `ingest.source` is a mapped VASP systems directory
# - `elemental_adsorption_ase_db`: `ingest.source` is an ASE DB file
#
# Typical workflow:
#   python -m moira.ingest --config config.toml
#   python -m moira --config config.toml
# Optional dataset overrides:
#   python -m moira --config config.toml data/raw_data/example_adsorption.json
#
# Optional ingest export:
# - Set `ingest.catbench_folder` to keep the emitted CatBench-style dataset tree
# - Leave it unset to use a temporary staging directory during the MLIP run

[ingest]
source = "data/raw_vasp/systems"
dataset_name = "example_dataset"
profile = "vasp_mapping"         # or "elemental_adsorption_ase_db"
# Optional:
# catbench_folder = "data/intermediate/example_catbench"

[ingest.stoich]
elements = ["N", "C", "O", "H"]
basis_species = ["N2", "CH4", "O2", "H2"]

[ingest.stoich.basis_composition]
N2 = { N = 2 }
CH4 = { C = 1, H = 4 }
O2 = { O = 2 }
H2 = { H = 2 }

[mlip]
dev_n = 2
dev_run = false
adapter_backend = "rootstock" # "rootstock" or "legacy"
device = "cuda"               # falls back to "cpu" if CUDA is unavailable
optimizer = "FIRE"
# Optional sharding controls for large datasets:
# shard_size = 1000
# num_shards = 32
# shard_index = 0
# Optional:
# run_tag = "dev"
# dataset = "data/raw_data/example_adsorption.json"
# datasets = ["data/raw_data/example_adsorption.json"]
# results_dir = "data/results/MamunHighT2019"
# catbench_source = "vendor/catbench"

[mlip.models]
enabled = ["mace", "mattersim", "orb_v3", "sevennet", "uma"]

[mlip.rootstock]
root = "/path/to/rootstock"
# python = "/path/to/rootstock/.venv/bin/python"

[mlip.rootstock.models.mace]
model = "mace"
mlip_name = "mace-mh-1"
checkpoint = "medium"
# output_model = "optional-output-name"
# model_version = "optional-version"
# [mlip.rootstock.models.mace.metadata]
# provider = "acme"

[mlip.rootstock.models.mattersim]
model = "mattersim"
mlip_name = "mattersim-v1-5m"
checkpoint = "models/mattersim/mattersim-v1.0.0-5M.pth"

[mlip.rootstock.models.orb_v3]
model = "orb_v3"
checkpoint = "orb_v3_conservative_inf_omat"
mlip_name = "orb-v3-conservative-inf-omat"

[mlip.rootstock.models.sevennet]
model = "sevennet"
checkpoint = "7net-omni"
mlip_name = "7net-omni"

[mlip.rootstock.models.sevennet.metadata]
modal = "mpa"

[mlip.rootstock.models.uma]
model = "uma"
# For `adapter_backend = "rootstock"`, this can be a Rootstock alias like
# "uma-s-1p1". For `adapter_backend = "legacy"`, this must be a real checkpoint
# file path instead.
checkpoint = "uma-s-1p1"
mlip_name = "uma-s-1p1"

[mlip.rootstock.models.uma.metadata]
task_name = "omat"

# Add "aqcat25", "alphanet", "chgnet", or "grace" to mlip.models.enabled only
# when adapter_backend = "legacy".
[mlip.rootstock.models.chgnet]
model = "chgnet"
mlip_name = "chgnet-r2scan"
# Legacy CHGNet uses the upstream pretrained model selector, not a local file.
# Known values include "0.3.0" (default) and "r2scan".
checkpoint = "r2scan"

[mlip.rootstock.models.aqcat25]
model = "aqcat25"
mlip_name = "aqcat25-ev2"
# Legacy AQCat25 uses a real checkpoint file from the gated Hugging Face repo.
checkpoint = "models/aqcat25/checkpoints_aqcat_ev2/ev2-in+midFiLM-AQCat25+OC20-20M.pt"

[mlip.rootstock.models.aqcat25.metadata]
# AQCat25's patched fairchem calculator uses `is_spin_off`; set false to force
# spin-polarized mode instead of the default element-based heuristic.
is_spin_off = true

[mlip.rootstock.models.alphanet]
model = "alphanet"
mlip_name = "alphanet-oma-v1"
# Legacy AlphaNet uses a real torch checkpoint file, not a Rootstock alias.
checkpoint = "models/alphanet/model.ckpt"

[mlip.rootstock.models.alphanet.metadata]
config = "models/alphanet/oma.json"

[mlip.rootstock.models.grace]
model = "grace"
mlip_name = "grace"
# Legacy GRACE uses an exported TensorFlow SavedModel directory.
checkpoint = "models/grace/saved_model"
